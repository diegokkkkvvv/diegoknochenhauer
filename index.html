<style>
  /* ===== Variables ===== */
  :root {
    --primary: #0071e3;
    --dark: #1d1d1f;
    --light: #f5f5f7;
    --gray: #86868b;
    --border: rgba(255,255,255,0.1);
    --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --gradient-hero: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.8) 100%);
  }

  /* ===== Reset ===== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    font-size: 16px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ===== Navigation ===== */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 1rem 2rem;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    transition: all 0.3s ease;
  }

  nav.scrolled {
    padding: 0.75rem 2rem;
    background: rgba(0,0,0,0.85);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: 1.25rem;
    font-weight: 600;
    background: var(--gradient-3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 400;
    transition: color 0.3s ease;
    position: relative;
  }

  .nav-links a:hover {
    color: #fff;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--primary);
    transition: width 0.3s ease;
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  /* ===== Hero Section ===== */
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(ellipse at center, rgba(100,126,234,0.1) 0%, transparent 70%);
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -1;
  }

  .hero-bg::before {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: radial-gradient(circle, rgba(100,126,234,0.3) 0%, transparent 40%);
    animation: pulse 20s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; }
    50% { transform: scale(1.1) rotate(180deg); opacity: 0.8; }
  }

  .hero-content {
    text-align: center;
    z-index: 1;
    max-width: 900px;
    padding: 0 2rem;
    animation: fadeInUp 1s ease-out;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .hero h1 {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.04em;
    margin-bottom: 1.5rem;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero .subtitle {
    font-size: clamp(1.125rem, 3vw, 1.5rem);
    font-weight: 400;
    color: var(--gray);
    margin-bottom: 3rem;
    letter-spacing: -0.02em;
  }

  .hero-cta {
    display: inline-flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    padding: 0.875rem 2rem;
    border-radius: 100px;
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    border: none;
    position: relative;
    overflow: hidden;
    font-family: inherit;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }

  .btn-primary:hover {
    background: #0077ed;
    transform: scale(1.05);
    box-shadow: 0 10px 30px rgba(0,113,227,0.3);
  }

  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: white;
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.05);
  }

  /* ===== Sections ===== */
  section {
    padding: 6rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
    opacity: 0;
    transform: translateY(50px);
    transition: all 0.8s ease;
  }

  section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .section-header {
    text-align: center;
    margin-bottom: 4rem;
  }

  h2 {
    font-size: clamp(2.5rem, 5vw, 3.5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 1rem;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.8) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .section-subtitle {
    font-size: 1.125rem;
    color: var(--gray);
    max-width: 600px;
    margin: 0 auto;
  }

  /* ===== About Section ===== */
  .about-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }

  .about-text {
    font-size: 1.125rem;
    line-height: 1.7;
    color: rgba(255,255,255,0.8);
  }

  .about-text strong {
    color: rgba(255,255,255,0.95);
    font-weight: 600;
  }

  .nationality-badges {
    display: flex;
    gap: 1rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
  }

  .badge {
    padding: 0.5rem 1rem;
    background: rgba(100,126,234,0.2);
    border-radius: 20px;
    font-size: 0.875rem;
    border: 1px solid rgba(100,126,234,0.3);
  }

  .about-image {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    aspect-ratio: 1;
    background: var(--gradient-1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    box-shadow: 0 20px 60px rgba(100,126,234,0.3);
  }

  /* ===== Projects Grid ===== */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    gap: 2rem;
    margin-top: 3rem;
  }

  .project-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    transition: all 0.4s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .project-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--gradient-3);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
  }

  .project-card:hover {
    transform: translateY(-10px);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }

  .project-card:hover::before {
    transform: translateX(0);
  }

  .project-icon {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: var(--gradient-2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
  }

  .project-card h3 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
    letter-spacing: -0.02em;
  }

  .project-card p {
    color: var(--gray);
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  .project-link {
    color: var(--primary);
    font-weight: 500;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    transition: gap 0.3s ease;
  }

  .project-link:hover {
    gap: 0.75rem;
  }

  /* ===== Skills Section ===== */
  .skills-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
    margin-top: 3rem;
  }

  .skill-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2rem;
    text-align: center;
    transition: all 0.3s ease;
  }

  .skill-card:hover {
    background: rgba(255,255,255,0.05);
    transform: translateY(-5px);
  }

  .skill-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 1.5rem;
    border-radius: 20px;
    background: var(--gradient-3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }

  .skill-card h3 {
    font-size: 1.25rem;
    margin-bottom: 0.5rem;
  }

  .skill-card p {
    color: var(--gray);
    font-size: 0.875rem;
    margin-top: 0.5rem;
    min-height: 40px;
  }

  .skill-level {
    display: flex;
    gap: 0.25rem;
    justify-content: center;
    margin-top: 1rem;
  }

  .skill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s ease;
  }

  .skill-dot.active {
    background: var(--primary);
    box-shadow: 0 0 10px rgba(0,113,227,0.5);
  }

  /* ===== Contact Section ===== */
  .contact-container {
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
  }

  /* Contact Form Styles */
  .contact-form {
    max-width: 500px;
    margin: 2rem auto;
    text-align: left;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: rgba(255,255,255,0.9);
    font-weight: 500;
    font-size: 0.875rem;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 1rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s ease;
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: rgba(255,255,255,0.4);
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.1);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 120px;
  }

  #form-status {
    margin-top: 1rem;
    text-align: center;
    font-weight: 500;
    min-height: 24px;
  }

  .social-links {
    display: flex;
    gap: 1rem;
    justify-content: center;
    margin-top: 3rem;
  }

  .social-link {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-decoration: none;
    transition: all 0.3s ease;
    font-size: 1.25rem;
  }

  .social-link:hover {
    background: var(--primary);
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 10px 30px rgba(0,113,227,0.3);
  }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    padding: 3rem 2rem;
    border-top: 1px solid var(--border);
    color: var(--gray);
    font-size: 0.875rem;
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .nav-links {
      display: none;
    }

    .about-content {
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    .hero-cta {
      flex-direction: column;
      align-items: center;
    }

    .btn {
      width: 100%;
      justify-content: center;
    }

    .projects-grid {
      grid-template-columns: 1fr;
    }

    .skills-container {
      grid-template-columns: 1fr;
    }
  }

  /* ===== Animations ===== */
  .float {
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }

  /* ===== Cursor Glow ===== */
  .cursor-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(100,126,234,0.15) 0%, transparent 70%);
    transition: opacity 0.3s ease;
    z-index: 9999;
    mix-blend-mode: screen;
  }
</style>
</head>

<!-- About Section -->
<section id="about">
  <div class="section-header">
    <h2
